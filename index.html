<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main>
    <section class="card">
      <section class="image">
        <img src="images/image-product-desktop.jpg" class="perfume-image" alt="Chanel - Gabrielle Perfume">
      </section>
      <section class="information">
        <!--Product titles-->
        <div class="titles">
          <h1>Gabrielle Essence Eau De Perfume</h1>
          <h2>Perfume</h2>
        </div>

        <!--Product description-->
        <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>

        <!--Product price-->
        <div class="price">
          <p><span class="promotion-price"> $149.99</span>
          <p><span class="old-price">$169.99</span></p>
        </div>
        <button><img src="images/icon-cart.svg" class="add-to-cart" alt="">Add to Cart</button>
      </section>  
    </section>    
  </main>

  <footer>
    <div class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/Princillia-B">Princillia-B</a>.
    </div>
  </footer>
</body>
</html>
