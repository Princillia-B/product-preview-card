<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main>
    <img src="images/image-product-desktop.jpg" alt="Chanel - Gabrielle Perfume">
    <h1>Gabrielle Essence Eau De Perfume</h1>
    <h2>Perfume</h2>
    <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>
    <p><span class="promotion-price"> $149.99</span>
      <p><span class="old-price">$169.99</span></p>
      <button><img src="" alt="">Add to Cart</button>
    </main>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Princillia-B</a>.
  </div>
</body>
</html>
